<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font Specimen</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header no-print">
  <div class="header-bar">
    <h1><button type="button" class="home-button" id="home">Font Specimen</button></h1>
    <span class="header-font" id="header-font"></span>
  </div>
</header>

<main>

  <!-- 1. The whole empty state: sample fonts either side of the banner -->
  <section class="loader no-print" id="loader">
    <span class="banner-slot" id="banner-slot"></span>
    <input type="file" id="file-input" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" hidden>
  </section>

  <!-- Everything below is hidden until a font loads -->
  <div id="specimen" hidden>

    <!-- The specimen opens on the typeface's own name, set in itself, with the
         style as quiet subtext beneath it. -->
    <header class="specimen-intro">
      <h2 class="font-name specimen-type" id="font-name"></h2>
      <p class="font-style" id="font-style"></p>
    </header>

    <!-- 5 + 4. Waterfall leads the page. The test string sits with it as a
         control, so editing happens next to what it changes. -->
    <section class="specimen-section" id="waterfall-section">
      <div class="section-controls no-print">
        <p class="hint"><button type="button" class="link-button" id="shuffle">Shuffle</button></p>

        <div class="control">
          <span class="control-scrub" id="tracking-scrub" role="slider" tabindex="0"
                aria-label="Letter spacing, thousandths of an em"
                aria-valuemin="-200" aria-valuemax="200" aria-valuenow="0"
                title="Drag left or right to change letter spacing">AV</span>
          <input class="control-input" id="tracking-input" type="number"
                 value="0" step="1" min="-200" max="200" aria-label="Letter spacing value">
        </div>
      </div>

      <div id="waterfall"></div>
    </section>

    <!-- Paragraphs: one text, two settings -->
    <section class="specimen-section" id="paragraphs-section">

      <div class="section-controls no-print">
        <p class="hint"><button type="button" class="link-button" id="para-shuffle">Shuffle</button></p>

        <div class="control-group">
          <div class="control">
            <span class="control-scrub" id="para-tracking-scrub" role="slider" tabindex="0"
                  aria-label="Paragraph letter spacing, thousandths of an em"
                  aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"
                  title="Drag left or right to change letter spacing">AV</span>
            <input class="control-input" id="para-tracking-input" type="number"
                   value="0" step="1" min="-100" max="100" aria-label="Paragraph letter spacing value">
          </div>

          <div class="control">
            <span class="control-scrub" id="para-leading-scrub" role="slider" tabindex="0"
                  aria-label="Line height, percent of font size"
                  aria-valuemin="80" aria-valuemax="260" aria-valuenow="150"
                  title="Drag left or right to change line height">LH</span>
            <input class="control-input" id="para-leading-input" type="number"
                   value="150" step="1" min="80" max="260" aria-label="Line height percent">
          </div>
        </div>
      </div>

      <div class="paragraphs" id="paragraphs"></div>
    </section>

    <!-- A page to set type on, with its own colour pairs -->
    <section class="specimen-section" id="page-section">

      <div class="section-controls no-print">
        <p class="hint"><button type="button" class="link-button" id="page-shuffle">Shuffle</button></p>

        <div class="control-group">
          <div class="control control--swatch">
            <button type="button" class="swatch" id="page-colors" aria-label="Next colour pair"
                    title="Cycle through colour pairs"></button>
          </div>

          <div class="control">
            <span class="control-scrub" id="page-size-scrub" role="slider" tabindex="0"
                  aria-label="Text size in pixels" aria-valuemin="12" aria-valuemax="240" aria-valuenow="64"
                  title="Drag left or right to change size">TT</span>
            <input class="control-input" id="page-size-input" type="number"
                   value="64" step="1" min="12" max="240" aria-label="Text size">
          </div>

          <div class="control">
            <span class="control-scrub" id="page-leading-scrub" role="slider" tabindex="0"
                  aria-label="Line height, percent of font size" aria-valuemin="80" aria-valuemax="260" aria-valuenow="120"
                  title="Drag left or right to change line height">LH</span>
            <input class="control-input" id="page-leading-input" type="number"
                   value="120" step="1" min="80" max="260" aria-label="Line height percent">
          </div>

          <div class="control">
            <span class="control-scrub" id="page-tracking-scrub" role="slider" tabindex="0"
                  aria-label="Letter spacing, thousandths of an em" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"
                  title="Drag left or right to change letter spacing">AV</span>
            <input class="control-input" id="page-tracking-input" type="number"
                   value="0" step="1" min="-100" max="100" aria-label="Letter spacing value">
          </div>

        </div>
      </div>

      <div class="page" id="page">
        <div class="page-text specimen-type" id="page-text" contenteditable="true" spellcheck="false"
             role="textbox" aria-multiline="true" aria-label="Page text"></div>
      </div>
    </section>

    <!-- 3. Font info -->
    <section class="specimen-section" id="info-section">
      <dl class="info-grid" id="info-grid"></dl>
    </section>

    <!-- 6. Glyph grid -->
    <section class="specimen-section" id="glyphs-section">
      <h2 class="section-title" id="glyph-count"></h2>
      <p class="hint no-print" id="glyph-hint"><button type="button" class="link-button" id="glyph-toggle" hidden></button></p>
      <p class="notice" id="glyph-notice" hidden></p>
      <div class="glyph-grid" id="glyph-grid"></div>
    </section>

  </div>
</main>

<footer class="site-footer no-print">
  <button type="button" id="print">Print / Save as PDF</button>
  <div class="font-preview" id="font-preview" aria-hidden="true"></div>
  <ul class="sample-list" id="sample-list"></ul>
</footer>

<p class="toast no-print" id="toast" role="status" aria-live="polite"></p>

<div class="drop-banner no-print" id="drop-banner">Drag and drop a font anywhere, or <button type="button" class="banner-button" id="banner-browse">choose a file</button></div>

<div class="glyph-viewer no-print" id="glyph-viewer" hidden role="dialog" aria-modal="true" aria-label="Glyph detail">
  <div class="viewer-bar">
    <span class="viewer-meta" id="viewer-meta"></span>
    <button type="button" class="link-button" id="viewer-close">Close</button>
  </div>
  <button type="button" class="viewer-arrow" id="viewer-prev" aria-label="Previous glyph">&larr;</button>
  <div class="viewer-stage" id="viewer-stage"></div>
  <button type="button" class="viewer-arrow" id="viewer-next" aria-label="Next glyph">&rarr;</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="app.js"></script>
</body>
</html>
